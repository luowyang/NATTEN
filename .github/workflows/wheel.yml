name: wheel
run-name: wheel ${{ inputs.request_id || github.run_id }}

# All entry points dispatch this controller on fork-ci. The source and
# the recipe are frozen independently before the build matrix starts.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source branch, fork tag or commit
        required: true
        default: dev
      channel:
        description: Release builds a candidate; promotion requires GPU evidence
        required: true
        default: warm
        type: choice
        options: [auto, warm, nightly, release]
      cache_namespace:
        description: Optional isolated sccache namespace
        default: ''
      expected_recipe_sha:
        description: Dispatch caller recipe identity (blank for manual runs)
        default: ''
      request_id:
        description: Unique ID used by the dispatching workflow to await this run
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: wheel-${{ inputs.channel }}-${{ inputs.ref }}
  cancel-in-progress: false

env:
  SHARD_COUNT: '8'
  NATTEN_CUDA_ARCH: '9.0'
  NATTEN_N_WORKERS: '1'
  NATTEN_AUTOGEN_POLICY: fine
  NATTEN_VERBOSE: '1'
  SCCACHE_GHA_ENABLED: 'true'

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      recipe_sha: ${{ steps.plan.outputs.recipe_sha }}
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      tag: ${{ steps.plan.outputs.tag }}
      build_id: ${{ steps.plan.outputs.build_id }}
      cache_key: ${{ steps.plan.outputs.cache_key }}
      cache_hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Checkout the recipe used by this workflow
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          persist-credentials: false
      - name: Freeze build plan
        id: plan
        env:
          SOURCE_REF: ${{ inputs.ref }}
          CHANNEL: ${{ inputs.channel }}
          RECIPE_SHA: ${{ github.sha }}
          EXPECTED_RECIPE_SHA: ${{ inputs.expected_recipe_sha }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          CACHE_NAMESPACE: ${{ inputs.cache_namespace }}
        run: |
          python .ci-tools/.github/scripts/build_plan.py create \
            --source-ref "$SOURCE_REF" --channel "$CHANNEL" \
            --recipe-sha "$RECIPE_SHA" --build-id "$BUILD_ID" \
            --output build-plan.json
      - uses: actions/upload-artifact@v7
        with:
          name: natten-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-plan.json
          if-no-files-found: error
          retention-days: 30
      - name: Look up warm marker
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: gate-marker.txt
          key: ${{ steps.plan.outputs.cache_key }}
          lookup-only: true

  checks:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NATTEN_CUDA_ARCH: ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.recipe_sha }}
          path: .ci-tools
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install CPU test environment
        run: |
          pip install -r .ci-tools/requirements-dev.txt
          pip install --no-build-isolation --no-deps -e .
      - name: Validate the pinned recipe
        run: |
          ufmt check .ci-tools/.github/scripts .ci-tools/integration .ci-tools/tests/test_fork_*.py
          flake8 .ci-tools/.github/scripts .ci-tools/integration .ci-tools/tests/test_fork_*.py
          python -m unittest discover -s .ci-tools/tests -p 'test_fork_*.py' -v
      - name: Validate the pinned source
        run: |
          ufmt check src/natten tests scripts setup.py
          flake8 src/natten tests scripts setup.py
          mypy src/natten
          if [[ -f tests/test_varlen_layout.py ]]; then
            pytest -v tests/test_varlen_layout.py
          else
            echo 'No varlen host suite on this source commit.' >> "$GITHUB_STEP_SUMMARY"
          fi

  warm:
    needs: [gate, checks]
    if: needs.gate.outputs.cache_hit != 'true'
    # Optional cache priming. Only build produces deliverable wheels.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Require a complete build attempt
        env:
          PLAN_BUILD_ID: ${{ needs.gate.outputs.build_id }}
          CURRENT_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [[ "$PLAN_BUILD_ID" != "$CURRENT_BUILD_ID" ]]; then
            echo '::error::This pipeline requires Re-run all jobs; partial retries would mix build attempts.'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.recipe_sha }}
          path: .ci-tools
          persist-credentials: false
      - uses: ./.ci-tools/.github/actions/prepare-build-env
        with:
          cache_namespace: ${{ inputs.cache_namespace }}
      - name: Precompile shard
        env:
          NATTEN_CI_SHARD_INDEX: ${{ matrix.shard }}
          NATTEN_CI_SHARD_COUNT: '8'
        run: |
          export TMPDIR="$RUNNER_TEMP"
          # Other shards compile empty placeholders outside sccache. Link
          # failure is allowed here; own-shard compile errors are not.
          python -m build --no-isolation --wheel -o dist/ > shard-build.log 2>&1 || BUILD_RC=$?
          echo "Shard build exited ${BUILD_RC:-0}"
          test ! -s /tmp/natten-shard-failures.txt
          test -s /tmp/natten-shard-compiled.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: warm-log-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: shard-build.log
          retention-days: 7

  build:
    needs: [gate, warm, checks]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.checks.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            python_tag: cp310
          - python: '3.11'
            python_tag: cp311
    steps:
      - name: Require a complete build attempt
        env:
          PLAN_BUILD_ID: ${{ needs.gate.outputs.build_id }}
          CURRENT_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [[ "$PLAN_BUILD_ID" != "$CURRENT_BUILD_ID" ]]; then
            echo '::error::This pipeline requires Re-run all jobs; partial retries would mix build attempts.'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.recipe_sha }}
          path: .ci-tools
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: natten-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan
      - uses: ./.ci-tools/.github/actions/prepare-build-env
        with:
          python_version: ${{ matrix.python }}
          cache_namespace: ${{ inputs.cache_namespace }}
      - name: Apply planned version
        run: python .ci-tools/.github/scripts/build_plan.py stamp --plan "$RUNNER_TEMP/plan/build-plan.json"
      - name: Build wheel
        run: |
          export TMPDIR="$RUNNER_TEMP"
          python -m build --no-isolation --wheel -o dist/ 2>&1 | tee build.log
      - name: Validate and install the wheel
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          PYTHON_TAG: ${{ matrix.python_tag }}
        run: |
          WHEELS=(dist/*.whl)
          test "${#WHEELS[@]}" -eq 1
          WHEEL="${WHEELS[0]}"
          python -I .ci-tools/.github/scripts/validate_wheel.py static "$WHEEL" --version "$VERSION" --python-tag "$PYTHON_TAG"
          pip install --force-reinstall --no-deps "$WHEEL"
          python -I .ci-tools/.github/scripts/validate_wheel.py installed "$WHEEL" --version "$VERSION" --python-tag "$PYTHON_TAG"
          python .ci-tools/.github/scripts/build_plan.py manifest \
            --plan "$RUNNER_TEMP/plan/build-plan.json" --wheel "$WHEEL" --python-tag "$PYTHON_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: natten-wheel-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python_tag }}
          path: |
            dist/*.whl
            dist/MANIFEST-*.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-log-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python_tag }}
          path: build.log
          retention-days: 7

  verify:
    needs: [gate, checks, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require a complete build attempt
        env:
          PLAN_BUILD_ID: ${{ needs.gate.outputs.build_id }}
          CURRENT_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [[ "$PLAN_BUILD_ID" != "$CURRENT_BUILD_ID" ]]; then
            echo '::error::This pipeline requires Re-run all jobs; partial retries would mix build attempts.'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.recipe_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: natten-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: plan
      - uses: actions/download-artifact@v7
        with:
          pattern: natten-wheel-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: artifacts
          merge-multiple: true
      - name: Verify the complete matrix
        run: python .github/scripts/finish_build.py verify --plan plan/build-plan.json --artifacts artifacts
      - name: Save warm marker only after both wheels pass
        run: echo '${{ needs.gate.outputs.cache_key }}' > gate-marker.txt
      - uses: actions/cache/save@v4
        if: needs.gate.outputs.cache_hit != 'true'
        continue-on-error: true
        with:
          path: gate-marker.txt
          key: ${{ needs.gate.outputs.cache_key }}
      - name: Release candidate summary
        if: needs.gate.outputs.channel == 'release'
        run: |
          echo 'Both candidate wheels passed host validation. Run GPU validation on these exact artifacts, then invoke promote.yml with their attestation.' >> "$GITHUB_STEP_SUMMARY"

  publish-nightly:
    needs: [gate, verify]
    if: needs.gate.outputs.channel == 'nightly'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: natten-nightly-publication
      cancel-in-progress: false
    steps:
      - name: Require a complete build attempt
        env:
          PLAN_BUILD_ID: ${{ needs.gate.outputs.build_id }}
          CURRENT_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [[ "$PLAN_BUILD_ID" != "$CURRENT_BUILD_ID" ]]; then
            echo '::error::This pipeline requires Re-run all jobs; partial retries would mix build attempts.'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.recipe_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: natten-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: plan
      - uses: actions/download-artifact@v7
        with:
          pattern: natten-wheel-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: artifacts
          merge-multiple: true
      - name: Publish complete host-validated nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/finish_build.py publish --plan plan/build-plan.json --artifacts artifacts --repository "$GITHUB_REPOSITORY"
