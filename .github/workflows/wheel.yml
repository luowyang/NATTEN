name: wheel

# Builds the NATTEN fork wheel on a GitHub-hosted runner, then (tag
# builds only) publishes a GitHub Release with the wheel attached. See
# .github/README-fork-ci.md for the full tag -> release flow.
#
# The build runs on GitHub-hosted runners because the organization's
# network does not allow self-hosted runners to reach GitHub Actions;
# there is no GPU on hosted runners, so kernel tests run elsewhere.
#
# CONSEQUENCE: no GPU on this runner, so this workflow cannot run
# libnatten's actual kernel tests. It still builds a real CUDA extension
# (nvcc targets sm_90a) and does a CPU-only import smoke test. GPU
# correctness validation happens outside this CI, via this fork's own
# build/test tooling (integration/build_wheel.sh and friends) -- unrelated
# to and unaffected by this workflow.
#
# LOG ACCESS: the same organization network that blocks self-hosted
# runners also blocks reading hosted-run logs and artifacts the normal
# way (`gh run view --log`, the jobs/logs API, and artifact downloads all
# redirect through hosts that are unreachable from here) -- confirmed the
# hard way when a build failed and neither `--log-failed` nor `gh run
# download` would return anything but "Forbidden". The last step in this
# job (`Relay build log and diagnostics`) works around that: it captures
# the build's own output, extracts likely-relevant lines as `::error::`
# workflow annotations (visible via `gh run view -v` / the Actions UI
# without needing the blocked hosts), and pushes the full log + a
# diagnostics summary to an orphan `ci-logs` branch via plain `git` over
# `github.com` (not blocked -- only the *reading* side, from this
# network, hits the blocked hosts; a runner pushing to github.com is
# unaffected).
#
# Triggers:
#   - push of a tag matching fork/* (the normal release path: assemble.sh
#     ... --tag, then `git push origin refs/tags/fork/<version>`)
#   - workflow_dispatch, with a `ref` input (tag, branch, or commit) to
#     build. The workflow *definition* always comes from whatever ref the
#     dispatch itself targets (`gh workflow run wheel.yml --ref ...`);
#     `inputs.ref` decouples that from what actually gets checked out and
#     built, so e.g. dispatching from fork-ci can still build and publish
#     a release for an already-existing tag like fork/0.21.7+fork.2.

on:
  push:
    tags:
      - 'fork/*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref (tag/branch/sha) to check out and build. Blank on a manual dispatch = the ref this workflow run itself was dispatched against.'
        required: false
        default: ''

concurrency:
  group: wheel-build
  cancel-in-progress: false

permissions:
  contents: write   # needed for the tag-build release step AND the
                     # ci-logs branch push below; repo default is
                     # read-only (checked via `gh api repos/luowyang/
                     # NATTEN/actions/permissions/workflow`), so this
                     # must be declared here to elevate it.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # a cold, uncached CUDA compile on a 4-vCPU hosted
                            # runner is far slower than the 39-worker dev-
                            # machine builds this fork's tooling was timed
                            # against; sccache (below) makes repeat builds
                            # much cheaper once its cache is warm, but the
                            # first run on a given source tree pays full price.
    steps:
      - name: Resolve build ref
        id: resolve_ref
        run: |
          set -euo pipefail
          BUILD_REF="${{ inputs.ref }}"
          if [[ -z "$BUILD_REF" ]]; then
            BUILD_REF="${{ github.ref_name }}"
          fi
          echo "build_ref=$BUILD_REF" >> "$GITHUB_OUTPUT"
          # A release only makes sense, and only gets attempted, for a ref
          # that IS one of this fork's fork/<version> tags -- checked by
          # name, not by github.ref_type, because github.ref_type reflects
          # the ref the *workflow run* was dispatched against (e.g. the
          # fork-ci branch), not `inputs.ref` (the ref actually built). A
          # branch push or a dispatch naming a plain branch both correctly
          # fall through to "artifact only".
          if [[ "$BUILD_REF" == fork/* ]]; then
            echo "is_tag_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag_build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Building ref: $BUILD_REF (tag build: $([[ "$BUILD_REF" == fork/* ]] && echo true || echo false))"

      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          # Mandatory: NATTEN's CMake build needs third_party/cutlass/include
          # populated; there is no assemble.sh step in this workflow to do
          # it, so actions/checkout must. An empty `ref` (push-tag trigger,
          # or a dispatch with no explicit input) falls back to actions/
          # checkout's own default (github.sha), which is exactly right for
          # both cases.

      - name: Set up Python 3.11
        id: setup_python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Free disk space if needed
        id: free_disk
        run: |
          set -euo pipefail
          echo "--- df -h (before) ---"
          df -h
          AVAIL_GB="$(df --output=avail -BG / | tail -1 | tr -dc '0-9')"
          echo "Available on / : ${AVAIL_GB}G"
          if [[ "$AVAIL_GB" -lt 12 ]]; then
            echo "Free space below 12G threshold -- clearing standard hosted-runner preinstalled bulk (dotnet/android/ghc; the usual 'maximize build space' trick) before the CUDA toolkit install."
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
            echo "--- df -h (after cleanup) ---"
            df -h
          else
            echo "Free space above threshold; skipping cleanup."
          fi

      - name: Install CUDA toolkit 12.8
        id: cuda-toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.8.0'
          method: local   # 'network' only installs the sub-packages you
                           # name, and NATTEN's own build (setup.py/CMake)
                           # has no documented minimal package list -- full
                           # 'local' install trades a few extra minutes for
                           # not having to guess apt sub-package names.
          linux-local-args: '["--toolkit"]'   # skip samples/docs, keep nvcc + libs

      - name: Disk space after CUDA toolkit install
        id: post_cuda_df
        run: df -h

      - name: Set up sccache
        id: sccache_setup
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install Python build dependencies
        id: deps
        run: |
          set -euo pipefail
          # Matches natten_dev's own torch build exactly (confirmed via
          # `python -c 'import torch; print(torch.__version__)'` there:
          # 2.11.0+cu128) and is a real wheel on this index for cp311/
          # manylinux_x86_64 (checked: https://download.pytorch.org/whl/cu128/torch/).
          pip install "torch==2.11.0" --index-url https://download.pytorch.org/whl/cu128
          pip install ninja "build>=1.3.0" "setuptools<82"
          # setuptools<82 for the same reason integration/build_wheel.sh
          # (this fork's dev-machine build tooling) pins it: torch's
          # installed metadata declares Requires-Dist: setuptools<82, and
          # `python -m build --no-isolation` (unlike a plain `pip install
          # -e .`) enforces build-system requirements' own declared
          # constraints.

      - name: Build wheel
        id: build
        env:
          NATTEN_CUDA_ARCH: "9.0"
          NATTEN_N_WORKERS: "2"     # NOT nproc. Hosted ubuntu-latest is 4
                                     # vCPU / 16GB RAM; nvcc/cicc/ptxas on
                                     # NATTEN's autogenerated translation
                                     # units can each use several GB. A
                                     # prior run's "Build wheel" step was
                                     # killed (exit 143) after ~36 minutes
                                     # with no compile-error text in its
                                     # annotations -- consistent with OOM
                                     # or disk exhaustion, not a code bug.
                                     # Capped low deliberately.
          NATTEN_AUTOGEN_POLICY: fine   # More (smaller) translation units
                                     # per kernel family than "default".
                                     # Checked setup.py's NUM_SPLITS table:
                                     # "fine" only raises each category's
                                     # split *count* (e.g. fna: 64 -> 128)
                                     # -- it does not change which kernels
                                     # get generated (same `categories`
                                     # dict, same autogen scripts either
                                     # way). Smaller, more numerous compile
                                     # units instead of fewer, larger ones
                                     # for the identical instantiation set
                                     # -- lower peak memory per nvcc
                                     # process, same output.
          NATTEN_VERBOSE: "1"
          SCCACHE_GHA_ENABLED: "true"
          # NATTEN_IS_BUILDING_DIST intentionally NOT set: setup.py would
          # append a second "+torch<ver>cu<ver>" local-version segment to
          # whatever src/natten/version.py already has, which is invalid
          # PEP 440 the moment version.py already carries "+fork.N" (a
          # real tag build) -- same reasoning integration/build_wheel.sh
          # documents in its own header, reused here since it applies
          # identically to this workflow's own `python -m build` call.
        run: |
          set -euo pipefail
          echo "--- free -m (before build) ---"
          free -m
          export CUDA_HOME="${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
          export TMPDIR="${{ runner.temp }}"

          # --- sccache compiler masquerade (no setup.py/CMakeLists.txt changes) ---
          # NATTEN's setup.py builds its `cmake` invocation as a hardcoded
          # Python list (checked: no CMAKE_ARGS / *_COMPILER_LAUNCHER
          # support anywhere in setup.py or csrc/CMakeLists.txt), so the
          # usual `-DCMAKE_CUDA_COMPILER_LAUNCHER=sccache` hook isn't
          # available here. CMake's own `project()`/`enable_language()`
          # compiler detection reads the CUDACXX/CXX environment variables
          # first when locating the CUDA/C++ compilers (standard CMake
          # behavior, unrelated to NATTEN) -- pointing those at wrapper
          # scripts that shell out through sccache gets the same effect
          # with zero repo changes, i.e. exactly the "minimal env-var
          # plumbing in the workflow only" this was scoped to.
          REAL_NVCC="$(command -v nvcc)"
          REAL_CXX="$(command -v c++)"
          mkdir -p /tmp/sccache-wrappers
          printf '#!/bin/sh\nexec sccache "%s" "$@"\n' "$REAL_NVCC" > /tmp/sccache-wrappers/nvcc
          printf '#!/bin/sh\nexec sccache "%s" "$@"\n' "$REAL_CXX"  > /tmp/sccache-wrappers/c++
          chmod +x /tmp/sccache-wrappers/nvcc /tmp/sccache-wrappers/c++
          export CUDACXX=/tmp/sccache-wrappers/nvcc
          export CXX=/tmp/sccache-wrappers/c++

          echo "nproc=$(nproc) NATTEN_N_WORKERS=$NATTEN_N_WORKERS CUDA_HOME=$CUDA_HOME"
          nvcc --version | tee /tmp/nvcc-version.txt
          python -m build --no-isolation --wheel -o dist/ 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          sccache --show-stats

      - name: Install wheel + import smoke test
        id: install_smoke
        run: |
          set -euo pipefail
          WHEEL="$(ls dist/*.whl)"
          echo "WHEEL=$WHEEL" >> "$GITHUB_ENV"
          pip install --no-deps "$WHEEL"
          # No GPU/driver on this runner (see header) -- this only proves
          # the wheel installs and the package imports cleanly. libnatten
          # is a real compiled extension in this wheel (built above with
          # NATTEN_CUDA_ARCH=9.0); natten/_libnatten/__init__.py's own
          # `except ImportError: HAS_LIBNATTEN = False` means even a
          # driver-load failure for the compiled .so degrades to stub
          # kernels rather than crashing the import. Actual kernel
          # correctness is validated on the dev machines, not here.
          python -c "import natten; print('natten.__version__ =', natten.__version__)"

      - name: Build manifest
        id: manifest
        run: |
          set -euo pipefail
          SHA256="$(sha256sum "$WHEEL" | awk '{print $1}')"
          VERSION="$(python -c 'import natten; print(natten.__version__)')"
          MANIFEST="dist/MANIFEST-${VERSION}.txt"
          {
            echo "NATTEN fork CI build manifest"
            echo "==============================="
            echo "Wheel file         : $(basename "$WHEEL")"
            echo "SHA256             : $SHA256"
            echo "Built (UTC)        : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "natten.__version__ : $VERSION"
            echo
            echo "Git commit         : ${{ github.sha }}"
            echo "Ref built          : ${{ steps.resolve_ref.outputs.build_ref }}"
            echo "Workflow run       : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Toolchain:"
            echo "  Runner           : GitHub-hosted ubuntu-latest (no GPU/driver)"
            echo "  Python           : $(python --version 2>&1)"
            echo "  torch            : $(python -c 'import torch; print(torch.__version__)')"
            echo "  torch CUDA       : $(python -c 'import torch; print(torch.version.cuda)')"
            echo "  nvcc             : $(tr '\n' ' ' < /tmp/nvcc-version.txt)"
            echo "  NATTEN_CUDA_ARCH : 9.0"
            echo "  NATTEN_N_WORKERS : 2"
            echo "  NATTEN_AUTOGEN_POLICY : fine"
            echo
            echo "GPU kernel tests: NOT run in this workflow (no GPU on"
            echo "ubuntu-latest). Only the CPU-only import smoke test above"
            echo "ran. GPU correctness validation happens on the dev"
            echo "machines via integration/build_wheel.sh and friends --"
            echo "see .github/README-fork-ci.md."
          } > "$MANIFEST"
          echo "MANIFEST=$MANIFEST" >> "$GITHUB_ENV"
          cat "$MANIFEST"

      - name: Upload wheel + manifest as workflow artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: natten-wheel-${{ github.run_id }}
          path: |
            dist/*.whl
            dist/MANIFEST-*.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release (fork/* tag builds only)
        id: release
        if: steps.resolve_ref.outputs.is_tag_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve_ref.outputs.build_ref }}"
          echo "Publishing release for tag $TAG: $WHEEL + $MANIFEST"
          if gh release view "$TAG" --repo luowyang/NATTEN >/dev/null 2>&1; then
            # The tag's release may already exist (e.g. created by hand,
            # with notes, ahead of a CI-built wheel ever landing) -- never
            # delete/recreate it, just attach/replace these two assets.
            gh release upload "$TAG" "$WHEEL" "$MANIFEST" --repo luowyang/NATTEN --clobber
          else
            gh release create "$TAG" "$WHEEL" "$MANIFEST" \
              --repo luowyang/NATTEN \
              --title "$TAG" \
              --notes-file "$MANIFEST" \
              --prerelease
          fi

      - name: Relay build log and diagnostics (ci-logs branch)
        id: relay_logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Deliberately no -e: this is best-effort diagnostics that must
          # not itself fail the job, and must keep going even if one
          # piece (e.g. sccache stats when sccache never ran) is missing.

          echo "--- last 60 lines of build.log ---"
          if [[ -f build.log ]]; then
            tail -n 60 build.log
          else
            echo "(no build.log -- Build wheel step likely never ran)"
          fi

          if [[ -f build.log ]]; then
            echo "--- error-pattern lines (last 20) -> workflow annotations ---"
            grep -aE "error|Error|Killed|No space|fatal" build.log | tail -n 20 | while IFS= read -r line; do
              esc="${line//$'\r'/}"
              esc="${esc//%/%25}"
              echo "::error::${esc}"
            done
          fi

          LOG_FILE=""
          if [[ -f build.log ]]; then
            SIZE="$(stat -c%s build.log)"
            if [[ "$SIZE" -gt 1048576 ]]; then
              gzip -f build.log
              LOG_FILE="build.log.gz"
            else
              LOG_FILE="build.log"
            fi
          fi

          {
            echo "wheel.yml run ${{ github.run_id }} attempt ${{ github.run_attempt }}"
            echo "Ref built    : ${{ steps.resolve_ref.outputs.build_ref }}"
            echo "Commit       : ${{ github.sha }}"
            echo "Workflow run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Step outcomes:"
            echo "  Resolve build ref                 : ${{ steps.resolve_ref.outcome }}"
            echo "  Checkout                           : ${{ steps.checkout.outcome }}"
            echo "  Set up Python 3.11                 : ${{ steps.setup_python.outcome }}"
            echo "  Free disk space if needed          : ${{ steps.free_disk.outcome }}"
            echo "  Install CUDA toolkit 12.8          : ${{ steps.cuda-toolkit.outcome }}"
            echo "  Disk space after CUDA install      : ${{ steps.post_cuda_df.outcome }}"
            echo "  Set up sccache                     : ${{ steps.sccache_setup.outcome }}"
            echo "  Install Python build dependencies  : ${{ steps.deps.outcome }}"
            echo "  Build wheel                        : ${{ steps.build.outcome }}"
            echo "  Install wheel + import smoke test  : ${{ steps.install_smoke.outcome }}"
            echo "  Build manifest                     : ${{ steps.manifest.outcome }}"
            echo "  Upload artifact                    : ${{ steps.upload.outcome }}"
            echo "  Create or update GitHub Release    : ${{ steps.release.outcome }}"
            echo
            echo "--- df -h ---"
            df -h
            echo
            echo "--- free -m ---"
            free -m
            echo
            echo "--- nproc ---"
            nproc
            echo
            echo "--- sccache --show-stats ---"
            sccache --show-stats 2>&1 || echo "(unavailable)"
          } > summary.txt

          echo "--- pushing diagnostics to ci-logs branch ---"
          git config --global user.email "ci@users.noreply.github.com"
          git config --global user.name "NATTEN fork CI"
          REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/luowyang/NATTEN.git"
          WORKDIR="$(mktemp -d)"
          if git ls-remote --exit-code "$REMOTE_URL" refs/heads/ci-logs >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch ci-logs "$REMOTE_URL" "$WORKDIR"
          else
            git init --quiet -b ci-logs "$WORKDIR"
          fi
          DEST="$WORKDIR/runs/${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$DEST"
          if [[ -n "$LOG_FILE" ]]; then
            cp "$LOG_FILE" "$DEST/"
          fi
          cp summary.txt "$DEST/"
          git -C "$WORKDIR" add -A
          if git -C "$WORKDIR" diff --cached --quiet; then
            echo "Nothing to commit (unexpected -- summary.txt should always be new)."
          else
            git -C "$WORKDIR" commit --quiet -m "wheel.yml run ${{ github.run_id }} attempt ${{ github.run_attempt }}: ${{ steps.build.outcome }}"
            git -C "$WORKDIR" push --quiet "$REMOTE_URL" "HEAD:refs/heads/ci-logs"
            echo "Pushed: runs/${{ github.run_id }}-${{ github.run_attempt }}/ on ci-logs"
          fi
          exit 0
