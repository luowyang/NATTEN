name: ci

# CPU checks run independently of CUDA compilation and GPU validation.
on:
  push:
    branches: [fork-ci, dev]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  lint-and-host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Install natten without CUDA
        run: pip install --no-build-isolation --no-deps -e .

      - name: ufmt check
        id: ufmt
        run: ufmt check src/natten tests scripts integration .github/scripts setup.py 2>&1 | tee ufmt.log

      - name: flake8
        id: flake8
        run: flake8 src/natten tests scripts integration .github/scripts setup.py 2>&1 | tee flake8.log

      - name: mypy (src/natten)
        id: mypy
        run: mypy src/natten 2>&1 | tee mypy.log

      - name: Fork build and publication mechanism tests (CPU)
        id: fork_tests
        # unittest discovery avoids the CUDA-related pytest conftest.
        run: python -m unittest discover -s tests -p 'test_fork_*.py' -v 2>&1 | tee fork_tests.log

      - name: Detect optional varlen host suite
        id: host_suite
        run: |
          if [[ -f tests/test_varlen_layout.py ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Varlen host suite: skipped (not present on this source ref).' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Varlen layout host tests
        id: host_tests
        if: steps.host_suite.outputs.present == 'true'
        run: pytest -v tests/test_varlen_layout.py 2>&1 | tee host_tests.log

      - name: Relay failure annotations
        if: failure()
        run: |
          set +e
          for f in ufmt.log flake8.log mypy.log fork_tests.log host_tests.log; do
            if [[ -f "$f" ]]; then
              echo "--- last 30 lines of $f ---"
              tail -n 30 "$f"
            fi
          done
          cat ufmt.log flake8.log mypy.log fork_tests.log host_tests.log 2>/dev/null \
            | grep -aE 'error|Error|FAILED|Traceback' | tail -n 20 | while IFS= read -r line; do
              esc="${line//$'\r'/}"
              esc="${esc//%/%25}"
              echo "::error::${esc}"
            done || true
