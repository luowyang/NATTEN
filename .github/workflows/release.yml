name: release-candidate

on:
  push:
    tags: ['fork/*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing fork/version tag to build as a release candidate
        required: true

permissions:
  contents: read
  actions: write

jobs:
  build-candidate:
    uses: luowyang/NATTEN/.github/workflows/dispatch.yml@fork-ci
    with:
      source_ref: ${{ inputs.tag || github.ref_name }}
      channel: release
